version: 2

models:

  - name: dim_patient
    description: "Patient dimension - one row per patient."
    columns:
      - name: patient_id
        tests:
          - not_null
          - unique

  - name: dim_doctor
    description: "Doctor dimension - one row per doctor."
    columns:
      - name: doctor_id
        tests:
          - not_null
          - unique

  - name: dim_department
    description: "Hospital department dimension."
    columns:
      - name: department_id
        tests:
          - not_null
          - unique

  - name: dim_insurance
    description: "Insurance provider dimension."
    columns:
      - name: insurance_provider_id
        tests:
          - not_null
          - unique

  - name: dim_date
    description: "Calendar dimension."
    columns:
      - name: date_key
        tests:
          - not_null
          - unique

  - name: fact_encounter
    description: "Encounter fact - one row per patient encounter."
    columns:

      - name: encounter_id
        tests:
          - not_null
          - unique

      - name: patient_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_patient')
                field: patient_id

      - name: doctor_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_doctor')
                field: doctor_id

      - name: department_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_department')
                field: department_id

      - name: date_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key